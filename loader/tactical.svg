<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="28" height="28">
  <!-- The tactical ring: tick marks round a sweep, in the film's cyan and
       green (frames 1262, 1274), with the magenta target pip. -->
  <style>
    .sweep { transform-origin: 14px 14px; animation: spin 2.4s linear infinite; }
    .pip { animation: blink 1.2s steps(1, end) infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes blink { 50% { opacity: 0.2; } }
    @media (prefers-reduced-motion: reduce) { .sweep, .pip { animation: none; } }
  </style>
  <circle cx="14" cy="14" r="13" fill="#000000"/>
  <g stroke="#8aebeb" stroke-width="1.6" stroke-linecap="round">
    <path d="M14 2.2v3M14 22.8v3M2.2 14h3M22.8 14h3M5.6 5.6l2 2M20.4 20.4l2 2M22.4 5.6l-2 2M7.6 20.4l-2 2"/>
  </g>
  <circle cx="14" cy="14" r="8.2" fill="none" stroke="#13eb25" stroke-width="1"/>
  <path class="sweep" d="M14 14 L14 5.8" stroke="#13eb25" stroke-width="1.6" stroke-linecap="round"/>
  <circle class="pip" cx="18.5" cy="10.5" r="1.7" fill="#df7aeb"/>
</svg>
