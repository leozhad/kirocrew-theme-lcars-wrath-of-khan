   * Upper monitor, after the deflector-shield schematic (frame 94): the
   * refit Enterprise in green wireframe, bow to the left, its arc of seven
   * lamps, the DEFLECTOR SHIELDS / OUTPUT / DENSITY block, SCAN CYCLE, and
   * the ship's name and registry. Orange pips blink on the hull, as on the
   * engineering schematics (frame 1322), and a scan line crosses the ship.
   *
   * Lower monitor, after the Kobayashi Maru screen (frames 55, 71): a blue
   * tactical ring with tick marks, cyan and violet orbit ellipses with pips
   * travelling them, the ship inside a dotted orange shield, the NAV / TAC /
   * COM counters, the opening log's stardate as the orange title, and the
   * engineering station's labelled bars and lamp ovals (frame 1322).
   */
  const SEED = 2285
  const TAU = Math.PI * 2
  const glow = (colour, b) => { ctx.shadowColor = colour; ctx.shadowBlur = b * DPR }
  const noGlow = () => { ctx.shadowBlur = 0 }
  // The largest cap height up to `cap` at which `str` fits in `maxW`.
  const fit = (str, cap, maxW, track = 0) => Math.max(1, Math.min(cap, maxW / Math.max(1e-6, textWidth(str, 1, track))))

  function rr(x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2))
    ctx.beginPath()
    ctx.moveTo(x + r, y)
    ctx.arcTo(x + w, y, x + w, y + h, r)
    ctx.arcTo(x + w, y + h, x, y + h, r)
    ctx.arcTo(x, y + h, x, y, r)
    ctx.arcTo(x, y, x + w, y, r)
    ctx.closePath()
  }

  // A monitor: the grey housing with rounded corners, a lighter lip, black glass.
  function housing(m) {
    const g = ctx.createLinearGradient(0, m.y, 0, m.y + m.h)
    g.addColorStop(0, C.rim)
    g.addColorStop(0.1, C.bezel)
    g.addColorStop(1, C.shade)
    ctx.fillStyle = g
    rr(m.x, m.y, m.w, m.h, m.R)
    ctx.fill()
    ctx.strokeStyle = C.rim
    ctx.lineWidth = Math.max(1, 0.1 * m.t)
    rr(m.x + 0.42 * m.t, m.y + 0.42 * m.t, m.w - 0.84 * m.t, m.h - 0.84 * m.t, m.R - 0.42 * m.t)
    ctx.stroke()
    const s = m.screen
    ctx.fillStyle = '#000'
    rr(s.x, s.y, s.w, s.h, s.r)
    ctx.fill()
  }
  function clipTo(s) { ctx.save(); rr(s.x, s.y, s.w, s.h, s.r); ctx.clip() }

  // The refit Enterprise, top view, bow to the left, centred on its saucer:
  // saucer rings and spokes and the hull line art, in saucer radii
  // (traced from frame 94; the same data as the pack's splash).
  function ship(sx, sy, r, colour, rot = 0, rings = C.rings, spokes = 24) {
    ctx.save()
    ctx.translate(sx, sy)
    ctx.rotate(rot)
    ctx.strokeStyle = colour
    ctx.lineWidth = Math.max(0.8, 0.028 * r)
    ctx.beginPath()
    for (const q of [1, ...rings]) { ctx.moveTo(q * r, 0); ctx.arc(0, 0, q * r, 0, TAU) }
    for (let k = 0; k < spokes; k++) {
      const a = k * TAU / spokes
      ctx.moveTo(0.22 * r * Math.cos(a), 0.22 * r * Math.sin(a))
      ctx.lineTo(r * Math.cos(a), r * Math.sin(a))
    }
    ctx.stroke()
    ctx.fillStyle = colour
    ctx.beginPath()
    for (const p of C.hull) {
      ctx.moveTo(p[0] * r, p[1] * r)
      for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i] * r, p[i + 1] * r)
      ctx.closePath()
    }
    ctx.fill('evenodd')
    ctx.restore()
  }

  // A point on an ellipse centred at (cx, cy), semi-axes rx, ry, turned by rot.
  function onEllipse(cx, cy, rx, ry, rot, a) {
    const x = rx * Math.cos(a), y = ry * Math.sin(a)
    return [cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)]
  }

  function layout(OX, OY) {
    const VW = W - OX, VH = H - OY
    const u = Math.max(7, Math.min(20, Math.min(VW / 64, VH / 56)))
    const pad = 1.2 * u, t = 1.5 * u, R = 3.2 * u, gap = 1.0 * u
    const x0 = OX + pad, x1 = W - pad, y0 = OY + pad, y1 = H - pad
    const hA = Math.round((y1 - y0 - gap) * 0.46)
    const mon = (x, y, w, h) => ({ x, y, w, h, t, R, screen: { x: x + t, y: y + t, w: w - 2 * t, h: h - 2 * t, r: R - 0.6 * t } })
    const A = mon(x0, y0, x1 - x0, hA)
    const B = mon(x0, y0 + hA + gap, x1 - x0, y1 - y0 - hA - gap)
    const a = A.screen, b = B.screen

    // Upper monitor: the schematic. Positions follow frame 94: saucer centre
    // at 29% of the screen, the text block 2.31 saucer radii aft of it.
    const r = Math.min(0.58 * a.w / 4.114, 0.33 * a.h)
    const sx = a.x + 0.29 * a.w, sy = a.y + 0.47 * a.h
    const lamps = []
    for (let i = 0; i < 7; i++) {
      const ang = Math.PI + i * (Math.PI / 2) / 6
      lamps.push([sx + 1.17 * r * Math.cos(ang), sy + 1.17 * r * Math.sin(ang)])
    }
    const pips = [[0.5, -0.36], [-0.32, 0.46], [1.55, 0.03], [2.6, 0.69], [2.42, -0.68]]
      .map(([px, py]) => ({ x: sx + px * r, y: sy + py * r, period: 0.9 + rnd() * 1.4, phase: rnd() }))
    const tx = sx + 2.31 * r
    const capS = fit(C.shields, 0.75 * u, a.x + a.w - 1.4 * u - tx, 0.08)
    const capName = fit(C.ship, 1.05 * u, a.w * 0.4, 0.1)
    const capScan = fit(C.scan + ': 000 ' + C.lps, 0.55 * u, a.w * 0.3, 0.08)

    // Lower monitor: the tactical display, after frame 55.
    const R2 = Math.min(0.38 * b.h, 0.16 * b.w)
    const cx = b.x + 0.22 * b.w, cy = b.y + 0.44 * b.h
    const ticks = []
    for (let k = 0; k < 36; k++) if (rnd() > 0.1) ticks.push([k * TAU / 36, k % 3 === 0 ? 0.2 : 0.1])
    const orbits = [
      { colour: C.cyan, rx: 0.40 * R2, ry: 1.0 * R2, rot: 0.5, speed: 0.09, phase: rnd() },
      { colour: C.violet, rx: 1.05 * R2, ry: 0.16 * R2, rot: 0.52, speed: 0.13, phase: rnd() },
    ]
    const stars = []
    for (let i = 0; i < 70; i++) {
      stars.push({ x: b.x + 0.03 * b.w + rnd() * 0.94 * b.w, y: b.y + 0.04 * b.h + rnd() * 0.9 * b.h,
        r: 0.5 + rnd() * 0.9, a: 0.15 + rnd() * 0.45, twinkle: rnd() < 0.15, on: true })
    }
    const counters = C.counters.map((label, i) => ({ label, x: b.x + (0.04 + 0.165 * i) * b.w,
      colour: [C.cyan, C.magenta, C.blue][i], v: 100 + ((rnd() * 800) | 0) }))
    const rx = b.x + 0.47 * b.w, rw = b.x + b.w - 1.6 * u - rx
    const capTitle = fit(C.stardate, 1.6 * u, rw, 0.15)
    const capLabel = fit('SYNCHRONIZATION', 0.62 * u, rw * 0.5, 0.05)
    const bars = C.bars.map((label, i) => {
      const v = 0.3 + rnd() * 0.7
      return { label, y: b.y + 0.36 * b.h + i * 2.1 * u, colour: [C.gravbar, C.gravbar, C.syncbar][i], v, to: v }
    })
    const ovals = []
    const ow = Math.min(3.4 * u, rw / 3 - 1.4 * u), oh = 0.9 * u
    for (let g = 0; g < 3; g++) for (let row = 0; row < 4; row++) {
      ovals.push({ x: rx + g * (rw / 3), y: b.y + 0.66 * b.h + row * 1.35 * u, on: rnd() < 0.7 })
    }
    L = { u, A, B, a, b, r, sx, sy, lamps, pips, tx, capS, capName, capScan, R2, cx, cy, ticks, orbits, stars, counters,
      rx, rw, capTitle, capLabel, bars, ovals, ow, oh,
      out: 2.9, density: 87, scan: 514 }
    L.bg = offscreen(paintStatic)
  }

  // Everything that does not move, drawn once per layout with its glow.
  function paintStatic() {
    const { u, A, B, a, b, r, sx, sy, tx, capS, capName, R2, cx, cy } = L
    rect(0, 0, W, H, '#000')
    housing(A)
    housing(B)

    clipTo(a)
    glow(C.strong, 0.55 * u)
    ship(sx, sy, r, C.strong)
    glow(C.text, 0.35 * u)
    const lh = 1.75 * capS
    text(C.shields, tx, sy - 1.1 * lh, capS, C.text, 'l', 0.08)
    text(C.output + ':', tx, sy - 0.1 * lh, capS, C.text, 'l', 0.08)
    text(C.density + ':', tx, sy + 0.9 * lh, capS, C.text, 'l', 0.08)
    // Name and registry under the ship's stern half, scan cycle to their left
    // (frame 94 has them at 54% and 15% of the screen; Michroma is wider).
    const nameX = a.x + 0.62 * a.w, capReg = 0.68 * capName
    text(C.ship, nameX, a.y + 0.875 * a.h, capName, C.text, 'c', 0.1)
    text(C.registry, nameX, a.y + 0.875 * a.h + 2.0 * capReg, capReg, C.muted, 'c', 0.12)
    text(C.scan + ':', a.x + 0.06 * a.w, a.y + 0.9 * a.h, L.capScan, C.muted, 'l', 0.08)
    noGlow()
    ctx.restore()

    clipTo(b)
    for (const s of L.stars) if (!s.twinkle) {
      ctx.globalAlpha = s.a
      ctx.fillStyle = '#fff'
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill()
    }
    ctx.globalAlpha = 1
    // The tactical ring and its tick marks.
    glow(C.blue, 0.45 * u)
    ctx.strokeStyle = C.blue
    ctx.lineWidth = Math.max(1, 0.16 * u)
    ctx.lineCap = 'round'
    ctx.beginPath()
    ctx.arc(cx, cy, R2, 0, TAU)
    for (const [ang, len] of L.ticks) {
      ctx.moveTo(cx + R2 * Math.cos(ang), cy + R2 * Math.sin(ang))
      ctx.lineTo(cx + R2 * (1 - len) * Math.cos(ang), cy + R2 * (1 - len) * Math.sin(ang))
    }
    ctx.stroke()
    for (const o of L.orbits) {
      glow(o.colour, 0.45 * u)
      ctx.strokeStyle = o.colour
      ctx.lineWidth = Math.max(1, 0.14 * u)
      ctx.beginPath()
      ctx.ellipse(cx, cy, o.rx, o.ry, o.rot, 0, TAU)
      ctx.stroke()
    }
    // The ship inside its dotted shield (the orange dotted sphere in frame 55).
    glow(C.accent, 0.3 * u)
    ctx.fillStyle = C.accent
    ctx.globalAlpha = 0.6
    for (let k = 0; k < 30; k++) {
      const [px, py] = onEllipse(cx, cy, 0.36 * R2, 0.3 * R2, -0.3, k * TAU / 30)
      ctx.beginPath(); ctx.arc(px, py, Math.max(0.8, 0.09 * u), 0, TAU); ctx.fill()
    }
    ctx.globalAlpha = 1
    const rs = 0.19 * R2, rot = -0.3
    glow(C.text, 0.35 * u)
    ship(cx - C.mid * rs * Math.cos(rot), cy - C.mid * rs * Math.sin(rot), rs, C.text, rot, [0.22, 0.49], 0)
    // Counter labels.
    for (const c of L.counters) {
      glow(c.colour, 0.3 * u)
      text(c.label, c.x, b.y + 0.93 * b.h, 0.55 * u, c.colour, 'l', 0.05)
    }
    // Title and labels on the right.
    glow(C.accent, 0.4 * u)
    text(C.stardate, L.rx, b.y + 0.2 * b.h, L.capTitle, C.accent, 'l', 0.15)
    for (const bar of L.bars) {
      glow(bar.colour, 0.3 * u)
      text(bar.label, L.rx, bar.y + 0.8 * u, L.capLabel, bar.colour, 'l', 0.05)
      ctx.globalAlpha = 0.35
      rect(L.rx + 0.52 * L.rw, bar.y + 0.9 * u, 0.48 * L.rw, Math.max(1, 0.1 * u), bar.colour)
      ctx.globalAlpha = 1
    }
    noGlow()
    ctx.globalAlpha = 0.18
    for (const o of L.ovals) pill(o.x, o.y, L.ow, L.oh, C.ovals)
    ctx.globalAlpha = 1
    ctx.restore()
  }

  function draw(t) {
    const { u, a, b, r, sx, sy, tx, capS, cx, cy } = L
    noGlow()
    ctx.drawImage(L.bg, 0, 0, W, H)

    clipTo(a)
    // The scan line crossing the ship, bow to stern.
    const sl = sx - r + ((t / 3.6) % 1) * 4.114 * r
    glow(C.strong, 0.6 * u)
    ctx.globalAlpha = 0.35
    rect(sl - 0.08 * u, sy - 0.9 * r, 0.16 * u, 1.8 * r, C.strong)
    ctx.globalAlpha = 1
    // The lamps: all lit, one brighter, stepping round the arc.
    const lit = Math.floor(t / 0.3) % L.lamps.length
    L.lamps.forEach(([lx, ly], i) => {
      glow(C.lamp, (i === lit ? 0.9 : 0.4) * u)
      ctx.globalAlpha = i === lit ? 1 : 0.55
      ctx.fillStyle = C.lamp
      ctx.beginPath(); ctx.arc(lx, ly, 0.36 * u, 0, TAU); ctx.fill()
    })
    ctx.globalAlpha = 1
    glow(C.accent, 0.5 * u)
    for (const p of L.pips) {
      if (((t / p.period + p.phase) % 1) < 0.55) {
        ctx.fillStyle = C.accent
        ctx.beginPath(); ctx.arc(p.x, p.y, 0.3 * u, 0, TAU); ctx.fill()
      }
    }
    glow(C.text, 0.35 * u)
    const lh = 1.75 * capS
    text(L.out.toFixed(1), tx + textWidth(C.output + ': ', capS, 0.08) + 0.3 * capS, sy - 0.1 * lh, capS, C.text, 'l', 0.08)
    text(String(L.density), tx + textWidth(C.density + ': ', capS, 0.08) + 0.3 * capS, sy + 0.9 * lh, capS, C.text, 'l', 0.08)
    const scanX = a.x + 0.06 * a.w + textWidth(C.scan + ': ', L.capScan, 0.08) + 0.3 * L.capScan
    text(L.scan + ' ' + C.lps, scanX, a.y + 0.9 * a.h, L.capScan, C.muted, 'l', 0.08)
    noGlow()
    ctx.restore()

    clipTo(b)
    for (const s of L.stars) if (s.twinkle && s.on) {
      ctx.globalAlpha = s.a
      ctx.fillStyle = '#fff'
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill()
    }
    ctx.globalAlpha = 1
    for (const o of L.orbits) {
      const [px, py] = onEllipse(cx, cy, o.rx, o.ry, o.rot, (o.phase + t * o.speed) * TAU)
      glow(o.colour, 0.6 * u)
      ctx.fillStyle = o.colour
      ctx.beginPath(); ctx.arc(px, py, 0.32 * u, 0, TAU); ctx.fill()
    }
    for (const c of L.counters) {
      glow(c.colour, 0.4 * u)
      const lx = c.x + textWidth(c.label, 0.55 * u, 0.05) + 0.25 * u
      text(String(c.v).padStart(3, '0'), lx, b.y + 0.93 * b.h, Math.min(1.45 * u, 0.06 * b.w), c.colour, 'l', 0.04)
    }
    for (const bar of L.bars) {
      glow(bar.colour, 0.4 * u)
      rect(L.rx + 0.52 * L.rw, bar.y, Math.max(0.6 * u, 0.48 * L.rw * bar.v), 0.75 * u, bar.colour)
    }
    glow(C.ovals, 0.35 * u)
    for (const o of L.ovals) if (o.on) pill(o.x, o.y, L.ow, L.oh, C.ovals)
    noGlow()
    ctx.restore()
  }

  function tick(dt) {
    const p = Math.min(1, dt * 10)
    if (Math.random() < 0.25 * p) L.out = Math.max(2.5, Math.min(3.3, L.out + (Math.random() - 0.5) * 0.4))
    if (Math.random() < 0.2 * p) L.density = 80 + ((Math.random() * 16) | 0)
    if (Math.random() < 0.5 * p) L.scan = 500 + ((Math.random() * 30) | 0)
    for (const c of L.counters) if (Math.random() < 0.15 * p) c.v = (c.v + 1 + ((Math.random() * 7) | 0)) % 1000
    for (const bar of L.bars) {
      if (Math.random() < 0.08 * p) bar.to = 0.2 + Math.random() * 0.8
      bar.v += (bar.to - bar.v) * Math.min(1, dt * 5)
    }
    for (let i = 0; i < 2; i++) if (Math.random() < 0.5 * p) {
      const o = L.ovals[(Math.random() * L.ovals.length) | 0]
      o.on = !o.on
    }
    for (const s of L.stars) if (s.twinkle && Math.random() < 0.1 * p) s.on = !s.on
  }
  // ── end of scene ──

  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1)
    W = Math.max(1, window.innerWidth)
    H = Math.max(1, window.innerHeight)
    canvas.width = Math.round(W * DPR)
    canvas.height = Math.round(H * DPR)
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0)
    seed = SEED
    // The dashboard paints its nav, session list and chat header above
    // overlays, so the scene is laid out in the area they leave visible.
    layout(W >= 1100 ? 520 : W >= 768 ? 250 : 0, W >= 768 ? 96 : 56)
  }

  loadImage(ATLAS.src).then(img => {
    ATLAS.img = img
    resize()
    window.addEventListener('resize', () => { resize(); draw(0) })
    draw(0)
    canvas.classList.add('on')
    const shownAt = performance.now()
    let raf = 0, stopped = false, last = shownAt, acc = 0
    const stop = () => { stopped = true; cancelAnimationFrame(raf) }
    const dismiss = () => {
      if (stopped) return
      stop()
      try { parent.postMessage({ type: 'theme:visibility', visible: false }, '*') } catch {}
    }
    // A browser can fire a synthetic mousemove when the frame appears under a
    // still pointer, so movement counts only after 1.5 s and beyond 8 px.
    let origin = null
    window.addEventListener('pointermove', e => {
      if (performance.now() - shownAt < 1500) return
      if (!origin) { origin = [e.clientX, e.clientY]; return }
      if (Math.hypot(e.clientX - origin[0], e.clientY - origin[1]) > 8) dismiss()
    })
    window.addEventListener('pointerdown', e => { e.preventDefault(); dismiss() })
    window.addEventListener('wheel', dismiss, { passive: true })
    window.addEventListener('keydown', dismiss)
    if (reduced) return
    const STEP = 0.1, SLEEP_AT = 30 * 60
    function frame(ts) {
      if (stopped) return
      acc += Math.min(0.5, (ts - last) / 1000)
      last = ts
      if (acc >= STEP) {
        tick(acc)
        acc = 0
        draw((ts - shownAt) / 1000)
        if ((ts - shownAt) / 1000 > SLEEP_AT && canvas.classList.contains('on')) {
          canvas.style.transition = 'opacity 3s linear'
          canvas.classList.remove('on')
          setTimeout(stop, 3200)
        }
      }
      raf = requestAnimationFrame(frame)
    }
    raf = requestAnimationFrame(frame)
  })
})()
</script>
</body>
</html>
